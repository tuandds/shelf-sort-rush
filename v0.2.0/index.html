<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Squadron</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(80% 50% at 50% 0%, #161f45, #04060d 70%); color: #f5f5f5;
        font-family: system-ui, -apple-system, sans-serif;
      }
      main { text-align: center; padding: 16px; }
      h1 { font-size: 2.5rem; margin: 0 0 8px; }
      p { color: #cfd8f5; margin: 0 0 32px; }
      nav { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
      a {
        display: block; padding: 14px 28px; border-radius: 10px;
        text-decoration: none; font-weight: 600; color: #04231a; background: linear-gradient(#6ef0ad, #22b573);
      }
      a.alt { background: rgba(255,255,255,.08); color: #cfd8f5; border: 1px solid rgba(255,255,255,.16); }
      a:hover { filter: brightness(1.1); }
      #versions { margin-top: 40px; display: none; }
      #versions h2 { font-size: 1.1rem; margin: 0 0 12px; }
      #versions ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
      #versions li { display: flex; gap: 12px; align-items: center; justify-content: center; }
      #versions li a { display: inline; padding: 6px 14px; font-size: 0.9rem; }
      #versions code { min-width: 9em; text-align: right; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pixel Squadron</h1>
      <p>Phi đội máy bay bắn sạch tranh pixel theo màu — puzzle Phaser 4 cho điện thoại</p>
      <nav>
        <a href="./demo/">Chơi ngay</a>
        <a class="alt" href="./docs/">Tài liệu</a>
        <a class="alt" href="./demo/editor.html">Level Editor</a>
      </nav>
      <section id="versions">
        <h2>Tất cả phiên bản</h2>
        <ul></ul>
      </section>
    </main>
    <script>
      // versions.json lives at the site root; versioned copies of this page sit one level down.
      const root = /\/v\d[^/]*\/(index\.html)?$/.test(location.pathname) ? '../' : './';
      fetch(root + 'versions.json')
        .then((r) => (r.ok ? r.json() : { versions: [] }))
        .then(({ versions }) => {
          const list = document.querySelector('#versions ul');
          for (const v of ['latest', ...versions]) {
            const dir = v === 'latest' ? root : `${root}${v}/`;
            const li = document.createElement('li');
            li.innerHTML = `<code></code><a href="${dir}demo/">Play</a><a class="alt" href="${dir}docs/">Docs</a>`;
            li.querySelector('code').textContent = v;
            list.append(li);
          }
          if (versions.length) document.getElementById('versions').style.display = 'block';
        })
        .catch(() => {});
    </script>
  </body>
</html>
